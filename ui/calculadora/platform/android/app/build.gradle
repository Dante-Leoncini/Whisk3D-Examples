apply plugin: 'com.android.application'

// Version = fecha de compilacion YY.MM.DD (mismo criterio que el editor / .deb).
def buildDate = new Date().format('yy.MM.dd')

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.whisk3d.calculadora"   // distinto del editor (com.whisk3d) -> conviven en el celular
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName buildDate
        ndk {
            // Mismas ABIs que jni/Application.mk: APK fat 32 + 64 bits.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    namespace 'com.whisk3d.calculadora'

    // UN solo APK firmado con nombre claro: whisk3d-calculadora-<fecha>-Android.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "whisk3d-calculadora-${buildDate}-Android.apk"
        }
    }
}
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.1.0'
}
